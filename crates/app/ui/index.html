<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evergreen Browser</title>
  <style>
    :root {
      --bg-chrome: #1e1e26;
      --bg-tab: #272733;
      --bg-tab-active: #141419;
      --bg-tab-hover: #2f2f3f;
      --bg-omnibox: #262633;
      --bg-omnibox-focus: #181820;
      --text-main: #f3f3f8;
      --text-muted: #9595a6;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: #4e8cff;
      --accent: #4e8cff;
      --danger-color: #ef4444;
      --font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-chrome);
      color: var(--text-main);
      font-family: var(--font-family);
      font-size: 13px;
      overflow: hidden;
      height: 76px;
      display: flex;
      flex-direction: column;
      border-bottom: 1px solid var(--border-subtle);
    }

    svg {
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* Tab Strip */
    .tab-strip {
      display: flex;
      align-items: center;
      height: 38px;
      padding: 5px 8px 0 8px;
      gap: 4px;
      background: var(--bg-chrome);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tab-strip::-webkit-scrollbar {
      display: none;
    }

    #tabsContainer {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 33px;
      min-width: 120px;
      max-width: 220px;
      padding: 0 10px;
      background: var(--bg-tab);
      border-radius: 8px 8px 0 0;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
      transition: background 0.1s ease, color 0.1s ease;
      position: relative;
      border: 1px solid transparent;
      border-bottom: none;
    }

    .tab.active {
      background: var(--bg-tab-active);
      color: var(--text-main);
      font-weight: 500;
      border-color: var(--border-subtle);
      box-shadow: 0 -2px 6px rgba(0, 0, 0, 0.25);
    }

    .tab:hover:not(.active) {
      background: var(--bg-tab-hover);
      color: var(--text-main);
    }

    .tab-title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-close {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 4px;
      opacity: 0.6;
      cursor: pointer;
      transition: opacity 0.1s ease, background 0.1s ease;
    }

    .tab-close:hover {
      background: rgba(255, 255, 255, 0.15);
      opacity: 1;
      color: var(--danger-color);
    }

    .tab-close svg {
      width: 12px;
      height: 12px;
    }

    .new-tab-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.1s ease, color 0.1s ease;
    }

    .new-tab-btn:hover {
      background: var(--bg-tab);
      color: var(--text-main);
    }

    .new-tab-btn svg {
      width: 16px;
      height: 16px;
    }

    /* Navigation Bar */
    .nav-bar {
      display: flex;
      align-items: center;
      height: 38px;
      padding: 0 8px;
      gap: 6px;
      background: var(--bg-tab-active);
      border-top: 1px solid var(--border-subtle);
      position: relative;
    }

    .nav-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.1s ease, color 0.1s ease;
    }

    .nav-btn:hover:not(:disabled) {
      background: var(--bg-tab-hover);
      color: var(--text-main);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .nav-btn svg {
      width: 16px;
      height: 16px;
    }

    /* Omnibox */
    .omnibox-container {
      flex: 1;
      display: flex;
      align-items: center;
      position: relative;
    }

    .omnibox-lock {
      position: absolute;
      left: 10px;
      display: flex;
      align-items: center;
      color: var(--text-muted);
      pointer-events: none;
    }

    .omnibox-lock svg {
      width: 13px;
      height: 13px;
    }

    .omnibox {
      width: 100%;
      height: 28px;
      background: var(--bg-omnibox);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 0 14px 0 30px;
      color: var(--text-main);
      font-size: 12px;
      font-family: inherit;
      outline: none;
      user-select: text;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .omnibox:focus {
      border-color: var(--border-focus);
      background: var(--bg-omnibox-focus);
    }

    .omnibox.loading {
      border-color: var(--accent);
      background-image: linear-gradient(
        45deg,
        rgba(255, 255, 255, 0.05) 25%,
        transparent 25%,
        transparent 50%,
        rgba(255, 255, 255, 0.05) 50%,
        rgba(255, 255, 255, 0.05) 75%,
        transparent 75%,
        transparent
      );
      background-size: 20px 20px;
      animation: progress-bar 1s linear infinite;
    }

    @keyframes progress-bar {
      from { background-position: 20px 0; }
      to { background-position: 0 0; }
    }

    /* Kebab Menu */
    .menu-dropdown {
      display: none;
      position: fixed;
      top: 38px;
      right: 8px;
      background: #20202a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      width: 210px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
      z-index: 1000;
      flex-direction: column;
      padding: 6px;
    }

    .menu-dropdown.open {
      display: flex;
    }

    .menu-item {
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-main);
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.1s ease;
    }

    .menu-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .menu-item svg {
      width: 15px;
      height: 15px;
      color: var(--text-muted);
    }

    .menu-separator {
      height: 1px;
      background: rgba(255, 255, 255, 0.07);
      margin: 4px 0;
    }

    .menu-shortcut {
      margin-left: auto;
      color: var(--text-muted);
      font-size: 11px;
      font-family: inherit;
    }
  </style>
</head>
<body>
  <!-- Tab Strip -->
  <div class="tab-strip" id="tabStrip" role="tablist" aria-label="Browser tabs">
    <div id="tabsContainer"></div>
    <button class="new-tab-btn" onclick="createNewTab()" title="New Tab (Ctrl+T)" aria-label="New Tab">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <!-- Navigation Bar -->
  <div class="nav-bar">
    <button class="nav-btn" id="btnBack" onclick="sendAction('GoBack')" title="Back (Alt+Left)" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <button class="nav-btn" id="btnForward" onclick="sendAction('GoForward')" title="Forward (Alt+Right)" aria-label="Forward">
      <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>
    <button class="nav-btn" id="btnReload" onclick="sendAction('Reload')" title="Reload (Ctrl+R)" aria-label="Reload">
      <svg viewBox="0 0 24 24">
        <path d="M21 2v6h-6"/>
        <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
        <path d="M3 22v-6h6"/>
        <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
      </svg>
    </button>

    <div class="omnibox-container">
      <div class="omnibox-lock">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <input
        type="text"
        class="omnibox"
        id="omnibox"
        placeholder="Search or enter address (Ctrl+L)"
        aria-label="Address and search bar"
        onkeydown="handleOmniboxKey(event)"
      />
    </div>

    <!-- 3-Dot Kebab Menu Toggle -->
    <button class="nav-btn" id="btnMenu" onclick="toggleMenu(event)" title="Menu" aria-label="Menu">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="1.5"/>
        <circle cx="12" cy="5" r="1.5"/>
        <circle cx="12" cy="19" r="1.5"/>
      </svg>
    </button>

    <!-- Kebab Dropdown Flyout -->
    <div class="menu-dropdown" id="menuDropdown">
      <div class="menu-item" onclick="createNewTab()">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        <span>New Tab</span>
        <span class="menu-shortcut">Ctrl+T</span>
      </div>
      <div class="menu-item" onclick="sendAction('OpenNewWindow')">
        <svg viewBox="0 0 24 24">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
          <line x1="8" y1="21" x2="16" y2="21"/>
          <line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
        <span>New Window</span>
        <span class="menu-shortcut">Ctrl+N</span>
      </div>
      <div class="menu-separator"></div>
      <div class="menu-item" onclick="sendAction('OpenDevTools')">
        <svg viewBox="0 0 24 24">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
        </svg>
        <span>DevTools</span>
        <span class="menu-shortcut">F12</span>
      </div>
      <div class="menu-item" onclick="sendAction('OpenSettings')">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span>Settings</span>
      </div>
    </div>
  </div>

  <script>
    let activeTabId = null;

    function postIpc(action, payload = null) {
      if (window.ipc) {
        window.ipc.postMessage(JSON.stringify({ action, payload }));
      } else {
        console.log('[IPC OUT]', action, payload);
      }
      closeMenu();
    }

    function sendAction(action) {
      postIpc(action);
    }

    function createNewTab() {
      postIpc('CreateTab', { url: null });
    }

    function closeTab(id, event) {
      if (event) event.stopPropagation();
      const tabEl = document.getElementById('tab-' + id);
      if (tabEl) tabEl.style.display = 'none';
      postIpc('CloseTab', { id });
    }

    function switchTab(id) {
      postIpc('SwitchTab', { id });
    }

    function handleOmniboxKey(e) {
      if (e.key === 'Enter') {
        const val = e.target.value.trim();
        if (val) {
          document.getElementById('omnibox').classList.add('loading');
          postIpc('Navigate', { url: val });
        }
      }
    }

    // Kebab Menu logic
    function toggleMenu(e) {
      e.stopPropagation();
      document.getElementById('menuDropdown').classList.toggle('open');
    }

    function closeMenu() {
      document.getElementById('menuDropdown').classList.remove('open');
    }

    document.addEventListener('click', closeMenu);

    // Keyboard Shortcuts listener inside chrome webview
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key.toLowerCase() === 't') {
        e.preventDefault();
        createNewTab();
      } else if (e.ctrlKey && e.key.toLowerCase() === 'w') {
        e.preventDefault();
        if (activeTabId) closeTab(activeTabId);
      } else if (e.ctrlKey && e.key.toLowerCase() === 'l') {
        e.preventDefault();
        window.__focusOmnibox();
      } else if (e.ctrlKey && e.key.toLowerCase() === 'r') {
        e.preventDefault();
        sendAction('Reload');
      } else if (e.key === 'F12') {
        e.preventDefault();
        sendAction('OpenDevTools');
      } else if (e.key === 'F5') {
        e.preventDefault();
        sendAction('Reload');
      }
    });

    // Window interface called by Rust host via evaluate_script
    window.__shellUpdate = function(state) {
      if (!state) return;

      const container = document.getElementById('tabsContainer');
      container.innerHTML = '';
      activeTabId = state.active_tab_id;

      if (state.tabs && state.tabs.length > 0) {
        state.tabs.forEach(tab => {
          const tabEl = document.createElement('div');
          tabEl.id = 'tab-' + tab.id;
          tabEl.className = 'tab' + (tab.id === state.active_tab_id ? ' active' : '');
          tabEl.setAttribute('role', 'tab');
          tabEl.setAttribute('aria-selected', tab.id === state.active_tab_id);
          tabEl.onclick = () => switchTab(tab.id);

          const titleEl = document.createElement('span');
          titleEl.className = 'tab-title';
          let displayTitle = tab.title;
          if (!displayTitle || displayTitle === 'about:blank' || displayTitle === 'evergreen://newtab') {
            displayTitle = 'New Tab';
          } else if (displayTitle === 'evergreen://settings') {
            displayTitle = 'Settings';
          }
          titleEl.textContent = displayTitle;
          titleEl.title = tab.title || tab.url;

          const closeEl = document.createElement('span');
          closeEl.className = 'tab-close';
          closeEl.innerHTML = '<svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>';
          closeEl.title = 'Close tab';
          closeEl.onclick = (ev) => closeTab(tab.id, ev);

          tabEl.appendChild(titleEl);
          tabEl.appendChild(closeEl);
          container.appendChild(tabEl);

          if (tab.id === state.active_tab_id) {
            const omnibox = document.getElementById('omnibox');
            if (document.activeElement !== omnibox) {
              if (tab.url === 'evergreen://newtab' || tab.url === 'about:blank') {
                omnibox.value = '';
                omnibox.placeholder = 'Search DuckDuckGo or enter address (Ctrl+L)';
              } else {
                omnibox.value = tab.url;
              }
            }
            omnibox.classList.remove('loading');

            document.getElementById('btnBack').disabled = !tab.can_go_back;
            document.getElementById('btnForward').disabled = !tab.can_go_forward;
          }
        });
      }
    };

    window.__focusOmnibox = function() {
      const omnibox = document.getElementById('omnibox');
      omnibox.focus();
      omnibox.select();
    };

    // Signal ready when DOM is parsed
    window.onload = () => {
      postIpc('ChromeReady');
    };
  </script>
</body>
</html>
