<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evergreen Browser</title>
  <link rel="icon" type="image/png" href="data:image/png;base64,{{LOGO_BASE64}}">
  <style>
    :root {
      --bg-chrome: #1e1e26;
      --bg-tab: #272733;
      --bg-tab-active: #141419;
      --bg-tab-hover: #2f2f3f;
      --bg-omnibox: #262633;
      --bg-omnibox-focus: #181820;
      --text-main: #f3f3f8;
      --text-muted: #9595a6;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: #4e8cff;
      --accent: #4e8cff;
      --accent-green: #34d399;
      --accent-amber: #f59e0b;
      --danger-color: #ef4444;
      --font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-chrome);
      color: var(--text-main);
      font-family: var(--font-family);
      font-size: 13px;
      overflow: hidden;
      height: 76px;
      display: flex;
      flex-direction: column;
      border-bottom: 1px solid var(--border-subtle);
    }

    svg {
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
    }

    /* Tab Strip */
    .tab-strip {
      display: flex;
      align-items: center;
      height: 38px;
      padding: 5px 8px 0 8px;
      gap: 4px;
      background: var(--bg-chrome);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tab-strip::-webkit-scrollbar {
      display: none;
    }

    #tabsContainer {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 33px;
      min-width: 140px;
      max-width: 240px;
      padding: 0 10px;
      background: var(--bg-tab);
      border-radius: 8px 8px 0 0;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
      transition: background 0.1s ease, color 0.1s ease;
      position: relative;
      border: 1px solid transparent;
      border-bottom: none;
    }

    .tab.active {
      background: var(--bg-tab-active);
      color: var(--text-main);
      font-weight: 500;
      border-color: var(--border-subtle);
      box-shadow: 0 -2px 6px rgba(0, 0, 0, 0.25);
    }

    .tab:hover:not(.active) {
      background: var(--bg-tab-hover);
      color: var(--text-main);
    }

    .tab-favicon {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      flex-shrink: 0;
      object-fit: contain;
    }

    .tab-title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 12px;
    }

    .tab-close {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 4px;
      opacity: 0.6;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.1s ease, background 0.1s ease;
    }

    .tab-close:hover {
      background: rgba(255, 255, 255, 0.15);
      opacity: 1;
      color: var(--danger-color);
    }

    .tab-close svg {
      width: 12px;
      height: 12px;
    }

    .new-tab-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.1s ease, color 0.1s ease, transform 0.1s ease;
    }

    .new-tab-btn:hover {
      background: var(--bg-tab);
      color: var(--text-main);
    }

    .new-tab-btn:active {
      transform: scale(0.92);
    }

    .new-tab-btn svg {
      width: 16px;
      height: 16px;
    }

    /* Navigation Bar */
    .nav-bar {
      display: flex;
      align-items: center;
      height: 38px;
      padding: 0 8px;
      gap: 6px;
      background: var(--bg-tab-active);
      border-top: 1px solid var(--border-subtle);
      position: relative;
    }

    .nav-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.1s ease, color 0.1s ease, transform 0.1s ease;
    }

    .nav-btn:hover:not(:disabled) {
      background: var(--bg-tab-hover);
      color: var(--text-main);
    }

    .nav-btn:active:not(:disabled) {
      transform: scale(0.92);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .nav-btn svg {
      width: 16px;
      height: 16px;
    }

    /* Micro-Animations for Navigation Buttons */
    @keyframes spinReload {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .nav-btn.animating-spin svg {
      animation: spinReload 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes nudgeBack {
      0% { transform: translateX(0); }
      40% { transform: translateX(-4px); }
      100% { transform: translateX(0); }
    }

    .nav-btn.animating-back svg {
      animation: nudgeBack 0.25s ease;
    }

    @keyframes nudgeForward {
      0% { transform: translateX(0); }
      40% { transform: translateX(4px); }
      100% { transform: translateX(0); }
    }

    .nav-btn.animating-forward svg {
      animation: nudgeForward 0.25s ease;
    }

    /* Omnibox */
    .omnibox-container {
      flex: 1;
      display: flex;
      align-items: center;
      position: relative;
      min-width: 0;
    }

    /* Interactive Padlock / Security Inspector Button */
    .omnibox-lock-btn {
      position: absolute;
      left: 6px;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: var(--text-muted);
      transition: background 0.1s ease, color 0.1s ease, transform 0.1s ease;
      z-index: 2;
    }

    .omnibox-lock-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .omnibox-lock-btn:active {
      transform: scale(0.92);
    }

    .omnibox-lock-btn.secure {
      color: var(--accent-green);
    }

    .omnibox-lock-btn.insecure {
      color: var(--accent-amber);
    }

    .omnibox-lock-btn.internal {
      color: var(--accent-blue);
    }

    .omnibox-lock-btn svg {
      width: 13px;
      height: 13px;
    }

    .omnibox {
      width: 100%;
      height: 28px;
      background: var(--bg-omnibox);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 0 14px 0 32px;
      color: var(--text-main);
      font-size: 12px;
      font-family: inherit;
      outline: none;
      user-select: text;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .omnibox:focus {
      border-color: var(--border-focus);
      background: var(--bg-omnibox-focus);
    }
  </style>
</head>
<body>
  <!-- Tab Strip -->
  <div class="tab-strip" id="tabStrip" role="tablist" aria-label="Browser tabs">
    <div id="tabsContainer"></div>
    <button class="new-tab-btn" onclick="createNewTab()" title="New Tab (Ctrl+T)" aria-label="New Tab">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <!-- Navigation Bar -->
  <div class="nav-bar">
    <button class="nav-btn" id="btnBack" onclick="goBack()" disabled title="Back (Alt+Left)" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <button class="nav-btn" id="btnForward" onclick="goForward()" disabled title="Forward (Alt+Right)" aria-label="Forward">
      <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>
    <button class="nav-btn" id="btnReload" onclick="reloadPage()" title="Reload (Ctrl+R / F5)" aria-label="Reload">
      <svg viewBox="0 0 24 24">
        <path d="M21 2v6h-6"/>
        <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
        <path d="M3 22v-6h6"/>
        <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
      </svg>
    </button>

    <div class="omnibox-container">
      <!-- Interactive Padlock Button -->
      <button class="omnibox-lock-btn secure" id="btnLock" onclick="toggleSecurityPanel(event)" title="View site information and certificate" aria-label="Site security information">
        <svg viewBox="0 0 24 24" id="lockIcon">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </button>

      <input
        type="text"
        class="omnibox"
        id="omnibox"
        placeholder="Search DuckDuckGo or enter address"
        aria-label="Address and search bar"
        onkeydown="handleOmniboxKey(event)"
      />
    </div>

    <!-- 3-Dot Menu Toggle (Toggles WinUI 3 Sidebar Panel) -->
    <button class="nav-btn" id="btnMenu" onclick="toggleMenuPanel(event)" title="Menu" aria-label="Menu">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="1.5"/>
        <circle cx="12" cy="5" r="1.5"/>
        <circle cx="12" cy="19" r="1.5"/>
      </svg>
    </button>
  </div>

  <script>
    let activeTabId = null;

    function postIpc(action, payload = null) {
      if (window.ipc) {
        window.ipc.postMessage(JSON.stringify({ action, payload }));
      } else {
        console.log('[IPC OUT]', action, payload);
      }
    }

    function sendAction(action) {
      postIpc(action);
    }

    function createNewTab() {
      postIpc('CreateTab', { url: null });
    }

    function closeTab(id, event) {
      if (event) event.stopPropagation();
      const tabEl = document.getElementById('tab-' + id);
      if (tabEl) tabEl.remove();
      postIpc('CloseTab', { id });
    }

    function switchTab(id) {
      postIpc('SwitchTab', { id });
    }

    function handleOmniboxKey(e) {
      if (e.key === 'Enter') {
        const val = e.target.value.trim();
        if (val) {
          postIpc('Navigate', { url: val });
        }
      }
    }

    function reloadPage() {
      const btn = document.getElementById('btnReload');
      btn.classList.remove('animating-spin');
      void btn.offsetWidth;
      btn.classList.add('animating-spin');
      btn.addEventListener('animationend', () => btn.classList.remove('animating-spin'), { once: true });
      sendAction('Reload');
    }

    function goBack() {
      const btn = document.getElementById('btnBack');
      if (btn.disabled) return;
      btn.classList.remove('animating-back');
      void btn.offsetWidth;
      btn.classList.add('animating-back');
      btn.addEventListener('animationend', () => btn.classList.remove('animating-back'), { once: true });
      sendAction('GoBack');
    }

    function goForward() {
      const btn = document.getElementById('btnForward');
      if (btn.disabled) return;
      btn.classList.remove('animating-forward');
      void btn.offsetWidth;
      btn.classList.add('animating-forward');
      btn.addEventListener('animationend', () => btn.classList.remove('animating-forward'), { once: true });
      sendAction('GoForward');
    }

    function toggleMenuPanel(e) {
      if (e) e.stopPropagation();
      postIpc('ToggleMenuPanel');
    }

    function toggleSecurityPanel(e) {
      if (e) e.stopPropagation();
      postIpc('ToggleSecurityPanel');
    }

    // Window interface called by Rust host via evaluate_script
    window.__shellUpdate = function(msg) {
      if (!msg) return;
      const state = msg.data || msg;
      if (!state.tabs) return;

      const container = document.getElementById('tabsContainer');
      const isTabSwitch = (activeTabId !== state.active_tab_id);
      activeTabId = state.active_tab_id;

      // Track incoming tabs to remove closed ones
      const incomingIds = new Set(state.tabs.map(t => t.id));

      // Remove any DOM tabs no longer present
      Array.from(container.children).forEach(child => {
        const rawId = child.id.replace('tab-', '');
        const numId = parseInt(rawId, 10);
        if (!incomingIds.has(numId)) {
          child.remove();
        }
      });

      // Smooth DOM diffing & updating
      state.tabs.forEach((tab) => {
        let tabEl = document.getElementById('tab-' + tab.id);
        const isActive = (tab.id === state.active_tab_id);

        if (!tabEl) {
          tabEl = document.createElement('div');
          tabEl.id = 'tab-' + tab.id;
          tabEl.className = 'tab';
          tabEl.setAttribute('role', 'tab');
          tabEl.onclick = () => switchTab(tab.id);

          // 1. Favicon element
          const iconEl = document.createElement('img');
          iconEl.className = 'tab-favicon';
          iconEl.alt = '';
          iconEl.onerror = function() { this.style.display = 'none'; };
          tabEl.appendChild(iconEl);

          // 2. Title element
          const titleEl = document.createElement('span');
          titleEl.className = 'tab-title';
          tabEl.appendChild(titleEl);

          // 3. Close button
          const closeEl = document.createElement('span');
          closeEl.className = 'tab-close';
          closeEl.innerHTML = '<svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>';
          closeEl.title = 'Close tab';
          closeEl.onclick = (ev) => closeTab(tab.id, ev);
          tabEl.appendChild(closeEl);

          // Append in order
          container.appendChild(tabEl);
        }

        // Update active class
        if (isActive) {
          tabEl.classList.add('active');
          tabEl.setAttribute('aria-selected', 'true');
        } else {
          tabEl.classList.remove('active');
          tabEl.setAttribute('aria-selected', 'false');
        }

        // Update Favicon source
        const iconEl = tabEl.querySelector('.tab-favicon');
        if (iconEl) {
          if (tab.url.startsWith('evergreen://newtab') || tab.url === 'about:blank' || tab.url.startsWith('evergreen://settings')) {
            // Official transparent logo favicon for internal pages
            iconEl.src = "data:image/png;base64,{{LOGO_BASE64}}";
            iconEl.style.display = 'block';
          } else if (tab.favicon_uri) {
            iconEl.src = tab.favicon_uri;
            iconEl.style.display = 'block';
          } else {
            iconEl.style.display = 'none';
          }
        }

        // Update Title text
        const titleEl = tabEl.querySelector('.tab-title');
        if (titleEl) {
          let displayTitle = tab.title;
          if (!displayTitle || displayTitle === 'about:blank' || displayTitle === 'evergreen://newtab') {
            displayTitle = 'New Tab';
          } else if (displayTitle === 'evergreen://settings') {
            displayTitle = 'Settings';
          }
          titleEl.textContent = displayTitle;
          titleEl.title = displayTitle;
        }

        // Update omnibox & navigation buttons for active tab
        if (isActive) {
          const omnibox = document.getElementById('omnibox');
          // Update URL instantaneously on tab switch or navigation
          if (!tab.url.startsWith('data:text/html')) {
            if (isTabSwitch || omnibox.dataset.lastSyncedUrl !== tab.url || document.activeElement !== omnibox) {
              omnibox.value = tab.url;
              omnibox.dataset.lastSyncedUrl = tab.url;
            }
          }

          document.getElementById('btnBack').disabled = !tab.can_go_back;
          document.getElementById('btnForward').disabled = !tab.can_go_forward;

          // Update Padlock Security Button status
          const lockBtn = document.getElementById('btnLock');
          const lockIcon = document.getElementById('lockIcon');
          if (tab.url.startsWith('https://')) {
            lockBtn.className = 'omnibox-lock-btn secure';
            lockBtn.dataset.state = 'secure';
            lockBtn.title = 'Connection is secure (HTTPS) — Click for certificate details';
            lockIcon.innerHTML = '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>';
          } else if (tab.url.startsWith('http://')) {
            lockBtn.className = 'omnibox-lock-btn insecure';
            lockBtn.dataset.state = 'insecure';
            lockBtn.title = 'Connection is not secure (HTTP) — Click for details';
            lockIcon.innerHTML = '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>';
          } else {
            lockBtn.className = 'omnibox-lock-btn internal';
            lockBtn.dataset.state = 'internal';
            lockBtn.title = 'Evergreen Sandbox Page — Click for details';
            lockIcon.innerHTML = '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>';
          }
        }
      });
    };

    window.__focusOmnibox = function() {
      const omnibox = document.getElementById('omnibox');
      omnibox.focus();
      omnibox.select();
    };

    // Signal ready when DOM is parsed
    window.onload = () => {
      postIpc('ChromeReady');
    };
  </script>
</body>
</html>
