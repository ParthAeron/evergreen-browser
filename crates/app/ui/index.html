<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evergreen Browser</title>
  <link rel="icon" type="image/png" href="data:image/png;base64,{{LOGO_BASE64}}">
  <style>
    :root {
      --bg-chrome: #1e1e26;
      --bg-tab: #272733;
      --bg-tab-active: #141419;
      --bg-tab-hover: #2f2f3f;
      --bg-omnibox: #262633;
      --bg-omnibox-focus: #181820;
      --text-main: #f3f3f8;
      --text-muted: #9595a6;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: #4e8cff;
      --accent: #4e8cff;
      --accent-green: #34d399;
      --accent-amber: #f59e0b;
      --danger-color: #ef4444;
      --font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-chrome);
      color: var(--text-main);
      font-family: var(--font-family);
      font-size: 13px;
      overflow: hidden;
      height: 100%;
      display: flex;
      flex-direction: column;
      border-bottom: 1px solid var(--border-subtle);
    }

    svg {
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
    }

    /* Tab Strip */
    .tab-strip {
      display: flex;
      align-items: center;
      height: 38px;
      padding: 5px 8px 0 8px;
      gap: 4px;
      background: var(--bg-chrome);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tab-strip::-webkit-scrollbar {
      display: none;
    }

    #tabsContainer {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 33px;
      min-width: 140px;
      max-width: 240px;
      padding: 0 10px;
      background: var(--bg-tab);
      border-radius: 8px 8px 0 0;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
      transition: background 0.1s ease, color 0.1s ease;
      position: relative;
      border: 1px solid transparent;
      border-bottom: none;
    }

    .tab.active {
      background: var(--bg-tab-active);
      color: var(--text-main);
      font-weight: 500;
      border-color: var(--border-subtle);
      box-shadow: 0 -2px 6px rgba(0, 0, 0, 0.25);
    }

    .tab:hover:not(.active) {
      background: var(--bg-tab-hover);
      color: var(--text-main);
    }

    .tab-favicon {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      flex-shrink: 0;
      object-fit: contain;
    }

    .tab-title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 12px;
    }

    .tab-close {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 4px;
      opacity: 0.6;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.1s ease, background 0.1s ease;
    }

    .tab-close:hover {
      background: rgba(255, 255, 255, 0.15);
      opacity: 1;
      color: var(--danger-color);
    }

    .tab-close svg {
      width: 12px;
      height: 12px;
    }

    .new-tab-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.1s ease, color 0.1s ease, transform 0.1s ease;
    }

    .new-tab-btn:hover {
      background: var(--bg-tab);
      color: var(--text-main);
    }

    .new-tab-btn:active {
      transform: scale(0.92);
    }

    .new-tab-btn svg {
      width: 16px;
      height: 16px;
    }

    /* Navigation Bar */
    .nav-bar {
      display: flex;
      align-items: center;
      height: 38px;
      padding: 0 8px;
      gap: 6px;
      background: var(--bg-tab-active);
      border-top: 1px solid var(--border-subtle);
      position: relative;
    }

    .nav-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.1s ease, color 0.1s ease, transform 0.1s ease;
    }

    .nav-btn:hover:not(:disabled) {
      background: var(--bg-tab-hover);
      color: var(--text-main);
    }

    .nav-btn:active:not(:disabled) {
      transform: scale(0.92);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .nav-btn svg {
      width: 16px;
      height: 16px;
    }

    /* Micro-Animations for Navigation Buttons */
    @keyframes spinReload {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .nav-btn.animating-spin svg {
      animation: spinReload 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes nudgeBack {
      0% { transform: translateX(0); }
      40% { transform: translateX(-4px); }
      100% { transform: translateX(0); }
    }

    .nav-btn.animating-back svg {
      animation: nudgeBack 0.25s ease;
    }

    @keyframes nudgeForward {
      0% { transform: translateX(0); }
      40% { transform: translateX(4px); }
      100% { transform: translateX(0); }
    }

    .nav-btn.animating-forward svg {
      animation: nudgeForward 0.25s ease;
    }

    /* Omnibox */
    .omnibox-container {
      flex: 1;
      display: flex;
      align-items: center;
      position: relative;
      min-width: 0;
    }

    /* Interactive Padlock / Security Inspector Button */
    .omnibox-lock-btn {
      position: absolute;
      left: 6px;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: var(--text-muted);
      transition: background 0.1s ease, color 0.1s ease, transform 0.1s ease;
      z-index: 2;
    }

    .omnibox-lock-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .omnibox-lock-btn:active {
      transform: scale(0.92);
    }

    .omnibox-lock-btn.secure {
      color: var(--accent-green);
    }

    .omnibox-lock-btn.insecure {
      color: var(--accent-amber);
    }

    .omnibox-lock-btn.internal {
      color: var(--accent-blue);
    }

    .omnibox-lock-btn svg {
      width: 13px;
      height: 13px;
    }

    .omnibox {
      width: 100%;
      height: 28px;
      background: var(--bg-omnibox);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 0 14px 0 32px;
      color: var(--text-main);
      font-size: 12px;
      font-family: inherit;
      outline: none;
      user-select: text;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .omnibox:focus {
      border-color: var(--border-focus);
      background: var(--bg-omnibox-focus);
    }

    /* Tab Dragging Styles */
    .tab.dragging {
      opacity: 0.45;
      transform: scale(0.96);
    }

    .tab.drag-over-left {
      border-left: 2px solid var(--accent-blue) !important;
    }

    .tab.drag-over-right {
      border-right: 2px solid var(--accent-blue) !important;
    }

    /* Zoom Badge & Dialog */
    .zoom-badge {
      position: absolute;
      right: 6px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      cursor: pointer;
      z-index: 3;
      transition: background 0.12s ease, border-color 0.12s ease;
    }

    .zoom-badge:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: var(--border-focus);
    }

    .zoom-dialog {
      position: absolute;
      right: 0;
      top: 36px;
      background: #1e1e28;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
      z-index: 100;
      animation: fadeInDown 0.15s ease;
    }

    .zoom-dialog-btn {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #272733;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }

    .zoom-dialog-btn:hover {
      background: #333344;
    }

    .zoom-dialog-reset {
      padding: 2px 8px;
      height: 24px;
      background: #272733;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
    }

    .zoom-dialog-reset:hover {
      background: #333344;
    }

    /* Downloads Toolbar & Progress Ring */
    .download-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .download-btn .download-icon {
      width: 14px;
      height: 14px;
      z-index: 1;
    }

    .download-ring {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 24px !important;
      height: 24px !important;
      pointer-events: none;
      transform: rotate(-90deg);
      z-index: 2;
    }

    .download-ring-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.1);
      stroke-width: 2.5;
    }

    .download-ring-fill {
      fill: none;
      stroke: var(--accent-blue);
      stroke-width: 2.5;
      stroke-dasharray: 81.68;
      stroke-dashoffset: 81.68;
      transition: stroke-dashoffset 0.25s linear;
    }

    .download-badge {
      position: absolute;
      top: -2px;
      right: -2px;
      background: var(--accent-blue);
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      min-width: 14px;
      height: 14px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 3px;
      z-index: 3;
    }

    /* Find In Page Tray */
    .find-bar {
      display: none;
      align-items: center;
      justify-content: flex-end;
      height: 38px;
      padding: 0 16px;
      gap: 8px;
      background: var(--bg-tab-active);
      border-top: 1px solid var(--border-subtle);
      flex-shrink: 0;
      animation: fadeInDown 0.12s ease;
    }

    .find-input {
      width: 220px;
      height: 26px;
      background: #14141a;
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 0 8px;
      color: var(--text-main);
      font-size: 12px;
      outline: none;
    }

    .find-input:focus {
      border-color: var(--border-focus);
    }

    .find-count {
      font-size: 11px;
      color: var(--text-muted);
      min-width: 44px;
      text-align: center;
    }

    .find-btn {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: 4px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 11px;
    }

    .find-btn:hover {
      background: #2b2b3b;
      color: var(--text-main);
    }

    /* Permission Prompt Tray */
    .permission-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      height: 38px;
      padding: 0 16px;
      background: #1e1e28;
      border-top: 1px solid var(--border-subtle);
      flex-shrink: 0;
      animation: fadeInDown 0.12s ease;
    }

    .permission-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--text-main);
    }

    .permission-icon {
      width: 16px;
      height: 16px;
      color: var(--accent-blue);
    }

    .permission-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .permission-btn {
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: background 0.12s ease;
    }

    .permission-btn.allow {
      background: var(--accent-green);
      color: #0b1a13;
    }

    .permission-btn.allow:hover {
      background: #4ade80;
    }

    .permission-btn.block {
      background: #2b2b3b;
      color: var(--text-main);
    }

    .permission-btn.block:hover {
      background: #38384d;
    }

    .permission-close {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 4px;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes zoomInModal {
      from { opacity: 0; transform: translate(-50%, -48%) scale(0.96); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
  </style>
</head>
<body>
  <!-- Tab Strip -->
  <div class="tab-strip" id="tabStrip" role="tablist" aria-label="Browser tabs">
    <div id="tabsContainer"></div>
    <button class="new-tab-btn" onclick="createNewTab()" title="New Tab (Ctrl+T)" aria-label="New Tab">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <!-- Navigation Bar -->
  <div class="nav-bar">
    <button class="nav-btn" id="btnBack" onclick="goBack()" disabled title="Back (Alt+Left)" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <button class="nav-btn" id="btnForward" onclick="goForward()" disabled title="Forward (Alt+Right)" aria-label="Forward">
      <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>
    <button class="nav-btn" id="btnReload" onclick="reloadPage()" title="Reload (Ctrl+R / F5)" aria-label="Reload">
      <svg viewBox="0 0 24 24">
        <path d="M21 2v6h-6"/>
        <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
        <path d="M3 22v-6h6"/>
        <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
      </svg>
    </button>

    <div class="omnibox-container">
      <!-- Interactive Padlock Button -->
      <button class="omnibox-lock-btn secure" id="btnLock" onclick="toggleSecurityPanel(event)" title="View site information and certificate" aria-label="Site security information">
        <svg viewBox="0 0 24 24" id="lockIcon">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </button>

      <input
        type="text"
        class="omnibox"
        id="omnibox"
        placeholder="Search DuckDuckGo or enter address"
        aria-label="Address and search bar"
        onkeydown="handleOmniboxKey(event)"
      />

      <!-- Zoom Badge & Dialog -->
      <button class="zoom-badge" id="zoomBadge" onclick="toggleZoomDialog(event)" style="display: none;">100%</button>
      <div class="zoom-dialog" id="zoomDialog" style="display: none;" onclick="event.stopPropagation()">
        <button class="zoom-dialog-btn" id="zoomOutBtn" onclick="zoomOut()" title="Zoom out (Ctrl+-)">−</button>
        <button class="zoom-dialog-reset" onclick="zoomReset()" id="zoomResetBtn" title="Reset zoom (Ctrl+0)">100%</button>
        <button class="zoom-dialog-btn" id="zoomInBtn" onclick="zoomIn()" title="Zoom in (Ctrl++)">+</button>
      </div>
    </div>

    <!-- Downloads Toolbar Button -->
    <button class="nav-btn download-btn" id="btnDownloads" onclick="toggleDownloadsShelf(event)" title="Downloads (Ctrl+J)" aria-label="Downloads">
      <svg class="download-icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
      <div class="download-badge" id="downloadBadge" style="display: none;">0</div>
      <svg class="download-ring" id="downloadRing" viewBox="0 0 32 32" style="display: none;">
        <circle cx="16" cy="16" r="13" class="download-ring-bg"/>
        <circle cx="16" cy="16" r="13" class="download-ring-fill" id="downloadRingFill"/>
      </svg>
    </button>

    <!-- 3-Dot Menu Toggle (Toggles WinUI 3 Sidebar Panel) -->
    <button class="nav-btn" id="btnMenu" onclick="toggleMenuPanel(event)" title="Menu" aria-label="Menu">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="1.5"/>
        <circle cx="12" cy="5" r="1.5"/>
        <circle cx="12" cy="19" r="1.5"/>
      </svg>
    </button>
  </div>

  <!-- Find In Page Tray (Expandable 3rd Row) -->
  <div class="find-bar" id="findBar" onclick="event.stopPropagation()">
    <input type="text" id="findInput" class="find-input" placeholder="Find in page..." oninput="executeFind(false)" onkeydown="handleFindKey(event)"/>
    <span class="find-count" id="findCount">0/0</span>
    <button class="find-btn" onclick="executeFind(false)" title="Previous (Shift+Enter)">▲</button>
    <button class="find-btn" onclick="executeFind(true)" title="Next (Enter)">▼</button>
    <button class="find-btn" id="closeFindBarBtn" onclick="closeFindBar()" title="Close (Esc)">✕</button>
  </div>

  <!-- Permission Prompt Tray (Expandable 3rd Row) -->
  <div class="permission-bar" id="permissionBar" onclick="event.stopPropagation()">
    <div class="permission-info">
      <svg class="permission-icon" id="permissionIcon" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span class="permission-msg" id="permissionMsg"></span>
    </div>
    <div class="permission-actions">
      <button class="permission-btn allow" id="permissionAllowBtn" onclick="resolvePermission(true)">Allow</button>
      <button class="permission-btn block" id="permissionBlockBtn" onclick="resolvePermission(false)">Block</button>
      <button class="permission-close" id="permissionDismissBtn" onclick="dismissPermission()">✕</button>
    </div>
  </div>

  <script>
    let activeTabId = null;
    let draggedTabId = null;
    let draggedTabIndex = null;

    function postIpc(action, payload = null) {
      if (window.ipc) {
        window.ipc.postMessage(JSON.stringify({ action, payload }));
      } else {
        console.log('[IPC OUT]', action, payload);
      }
    }

    function sendAction(action) {
      postIpc(action);
    }

    function createNewTab() {
      postIpc('CreateTab', { url: null });
    }

    function closeTab(id, event) {
      if (event) event.stopPropagation();
      const tabEl = document.getElementById('tab-' + id);
      if (tabEl) tabEl.remove();
      postIpc('CloseTab', { id });
    }

    function switchTab(id) {
      postIpc('SwitchTab', { id });
    }

    function handleOmniboxKey(e) {
      if (e.key === 'Enter') {
        const val = e.target.value.trim();
        if (val) {
          postIpc('Navigate', { url: val });
        }
      }
    }

    function reloadPage() {
      const btn = document.getElementById('btnReload');
      btn.classList.remove('animating-spin');
      void btn.offsetWidth;
      btn.classList.add('animating-spin');
      btn.addEventListener('animationend', () => btn.classList.remove('animating-spin'), { once: true });
      sendAction('Reload');
    }

    function goBack() {
      const btn = document.getElementById('btnBack');
      if (btn.disabled) return;
      btn.classList.remove('animating-back');
      void btn.offsetWidth;
      btn.classList.add('animating-back');
      btn.addEventListener('animationend', () => btn.classList.remove('animating-back'), { once: true });
      sendAction('GoBack');
    }

    function goForward() {
      const btn = document.getElementById('btnForward');
      if (btn.disabled) return;
      btn.classList.remove('animating-forward');
      void btn.offsetWidth;
      btn.classList.add('animating-forward');
      btn.addEventListener('animationend', () => btn.classList.remove('animating-forward'), { once: true });
      sendAction('GoForward');
    }

    function toggleMenuPanel(e) {
      if (e) e.stopPropagation();
      postIpc('ToggleMenuPanel');
    }

    function toggleSecurityPanel(e) {
      if (e) e.stopPropagation();
      postIpc('ToggleSecurityPanel');
    }

    /* Zoom Management */
    let currentZoomFactor = 1.0;
    let zoomHideTimeout = null;

    function updateZoomUI(factor) {
      currentZoomFactor = factor;
      const percent = Math.round(factor * 100);
      const badge = document.getElementById('zoomBadge');
      const resetBtn = document.getElementById('zoomResetBtn');
      badge.textContent = percent + '%';
      if (resetBtn) resetBtn.textContent = percent + '%';

      if (percent !== 100) {
        badge.style.display = 'block';
        const dialog = document.getElementById('zoomDialog');
        dialog.style.display = 'flex';
        clearTimeout(zoomHideTimeout);
        zoomHideTimeout = setTimeout(() => {
          dialog.style.display = 'none';
        }, 2500);
      } else {
        badge.style.display = 'none';
        document.getElementById('zoomDialog').style.display = 'none';
      }
    }

    function toggleZoomDialog(e) {
      if (e) e.stopPropagation();
      const dialog = document.getElementById('zoomDialog');
      const isOpening = dialog.style.display !== 'flex';
      dialog.style.display = isOpening ? 'flex' : 'none';
    }

    function zoomIn() { postIpc('ZoomIn'); }
    function zoomOut() { postIpc('ZoomOut'); }
    function zoomReset() { postIpc('ZoomReset'); }

    window.__syncZoom = function(factor) {
      updateZoomUI(factor);
    };

    /* Downloads Management */
    const activeDownloads = new Map();

    function toggleDownloadsShelf(e) {
      if (e) e.stopPropagation();
      postIpc('ToggleDownloadsSidebar');
    }

    window.__downloadProgress = function(data) {
      activeDownloads.set(data.download_id, {
        filename: data.filename,
        received: data.received_bytes,
        total: data.total_bytes,
        state: data.state
      });
      const badge = document.getElementById('downloadBadge');
      const ring = document.getElementById('downloadRing');
      const ringFill = document.getElementById('downloadRingFill');

      const activeCount = Array.from(activeDownloads.values()).filter(d => d.state === 'InProgress').length;
      badge.textContent = activeCount;
      badge.style.display = activeCount > 0 ? 'flex' : 'none';
      ring.style.display = activeCount > 0 ? 'block' : 'none';

      let totalReceived = 0;
      let totalExpected = 0;
      for (const item of activeDownloads.values()) {
        if (item.state === 'InProgress') {
          totalReceived += item.received;
          totalExpected += item.total;
        }
      }
      if (totalExpected > 0) {
        const overallPct = Math.min(1, totalReceived / totalExpected);
        const offset = 81.68 * (1 - overallPct);
        ringFill.style.strokeDashoffset = offset;
      }
    };

    /* Find In Page */
    function toggleFindBar() {
      const bar = document.getElementById('findBar');
      const isOpen = (bar.style.display === 'flex');
      if (isOpen) {
        closeFindBar();
      } else {
        document.getElementById('zoomDialog').style.display = 'none';
        bar.style.display = 'flex';
        postIpc('OpenFindInPage');
        const input = document.getElementById('findInput');
        input.focus();
        input.select();
        if (input.value) executeFind(true);
      }
    }

    function closeFindBar() {
      const bar = document.getElementById('findBar');
      if (bar.style.display === 'none') return;
      bar.style.display = 'none';
      postIpc('CloseFindInPage');
    }

    function executeFind(forward) {
      const query = document.getElementById('findInput').value;
      if (!query) {
        document.getElementById('findCount').textContent = '0/0';
        return;
      }
      postIpc('FindInPage', { query, forward });
    }

    function handleFindKey(e) {
      if (e.key === 'Enter') {
        executeFind(!e.shiftKey);
      } else if (e.key === 'Escape') {
        closeFindBar();
      }
    }

    window.__syncFindResult = function(data) {
      const count = document.getElementById('findCount');
      if (data.total > 0) {
        count.textContent = `${data.current} of ${data.total}`;
      } else {
        count.textContent = '0/0';
      }
    };

    window.__toggleFindBar = toggleFindBar;

    /* Permission Prompt Bar */
    let currentPermissionId = null;

    window.__permissionPrompt = function(data) {
      currentPermissionId = data.permission_id;
      const bar = document.getElementById('permissionBar');
      const msg = document.getElementById('permissionMsg');
      const icon = document.getElementById('permissionIcon');

      const kind = (data.permission_kind || '').toLowerCase();
      let iconSvg = '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>';
      if (kind.includes('camera')) {
        iconSvg = '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>';
      } else if (kind.includes('microphone') || kind.includes('audio')) {
        iconSvg = '<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/>';
      } else if (kind.includes('geolocation') || kind.includes('location')) {
        iconSvg = '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>';
      } else if (kind.includes('notification')) {
        iconSvg = '<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/>';
      }

      icon.innerHTML = iconSvg;
      msg.textContent = `${data.origin} wants to access your ${data.permission_kind}`;
      bar.style.display = 'flex';
      postIpc('OpenPermissionPrompt');
    };

    function resolvePermission(allow) {
      if (currentPermissionId !== null) {
        postIpc('PermissionResponse', { permission_id: currentPermissionId, allow });
        currentPermissionId = null;
      }
      document.getElementById('permissionBar').style.display = 'none';
      postIpc('ClosePermissionPrompt');
    }

    function dismissPermission() {
      if (currentPermissionId !== null) {
        postIpc('PermissionResponse', { permission_id: currentPermissionId, allow: false });
        currentPermissionId = null;
      }
      document.getElementById('permissionBar').style.display = 'none';
      postIpc('ClosePermissionPrompt');
    }

    /* Link Preview (Peek Modal & Status Tooltip) */
    let currentPreviewUrl = '';

    window.__showStatusPreview = function(url) {
      const bar = document.getElementById('statusPreviewBar');
      if (url) {
        bar.textContent = url;
        bar.style.display = 'block';
      } else {
        bar.style.display = 'none';
      }
    };

    window.__hideStatusPreview = function() {
      window.__showStatusPreview('');
    };

    window.__showLinkPreview = function(url) {
      currentPreviewUrl = url;
      const modal = document.getElementById('linkPreviewModal');
      const title = document.getElementById('linkPreviewTitle');
      const frame = document.getElementById('linkPreviewFrame');
      title.textContent = url;
      frame.src = url;
      modal.style.display = 'flex';
    };

    function closeLinkPreview() {
      const modal = document.getElementById('linkPreviewModal');
      const frame = document.getElementById('linkPreviewFrame');
      modal.style.display = 'none';
      frame.src = 'about:blank';
    }

    function openPreviewInNewTab() {
      if (currentPreviewUrl) {
        postIpc('CreateTab', { url: currentPreviewUrl });
        closeLinkPreview();
      }
    }

    /* Tab Rendering & Drag Reorder */
    window.__shellUpdate = function(msg) {
      if (!msg) return;
      const state = msg.data || msg;
      if (!state.tabs) return;

      const container = document.getElementById('tabsContainer');
      const isTabSwitch = (activeTabId !== state.active_tab_id);
      activeTabId = state.active_tab_id;

      const incomingIds = new Set(state.tabs.map(t => t.id));

      Array.from(container.children).forEach(child => {
        const rawId = child.id.replace('tab-', '');
        const numId = parseInt(rawId, 10);
        if (!incomingIds.has(numId)) {
          child.remove();
        }
      });

      state.tabs.forEach((tab, index) => {
        let tabEl = document.getElementById('tab-' + tab.id);
        const isActive = (tab.id === state.active_tab_id);

        if (!tabEl) {
          tabEl = document.createElement('div');
          tabEl.id = 'tab-' + tab.id;
          tabEl.className = 'tab';
          tabEl.setAttribute('role', 'tab');
          tabEl.onclick = () => switchTab(tab.id);

          // Drag and drop listeners
          tabEl.draggable = true;
          tabEl.ondragstart = (e) => {
            draggedTabId = tab.id;
            draggedTabIndex = parseInt(tabEl.dataset.index, 10);
            tabEl.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', tab.id);
          };

          tabEl.ondragend = (e) => {
            tabEl.classList.remove('dragging');
            document.querySelectorAll('.tab').forEach(t => {
              t.classList.remove('drag-over-left', 'drag-over-right');
            });
            // Detach if dragged outside bounds
            if (e.clientY > 80 || e.clientX < -20 || e.clientX > window.innerWidth + 20 || e.clientY < -50) {
              postIpc('DetachTabToNewWindow', { tab_id: draggedTabId, screen_x: e.screenX, screen_y: e.screenY });
            }
          };

          tabEl.ondragover = (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            const rect = tabEl.getBoundingClientRect();
            const mid = rect.left + rect.width / 2;
            if (e.clientX < mid) {
              tabEl.classList.add('drag-over-left');
              tabEl.classList.remove('drag-over-right');
            } else {
              tabEl.classList.add('drag-over-right');
              tabEl.classList.remove('drag-over-left');
            }
          };

          tabEl.ondragleave = () => {
            tabEl.classList.remove('drag-over-left', 'drag-over-right');
          };

          tabEl.ondrop = (e) => {
            e.preventDefault();
            tabEl.classList.remove('drag-over-left', 'drag-over-right');
            const targetIndex = parseInt(tabEl.dataset.index, 10);
            if (draggedTabIndex !== null && draggedTabIndex !== targetIndex) {
              postIpc('ReorderTab', { from_index: draggedTabIndex, to_index: targetIndex });
            }
          };

          // 1. Favicon element
          const iconEl = document.createElement('img');
          iconEl.className = 'tab-favicon';
          iconEl.alt = '';
          iconEl.onerror = function() { this.style.display = 'none'; };
          tabEl.appendChild(iconEl);

          // 2. Title element
          const titleEl = document.createElement('span');
          titleEl.className = 'tab-title';
          tabEl.appendChild(titleEl);

          // 3. Close button
          const closeEl = document.createElement('span');
          closeEl.className = 'tab-close';
          closeEl.innerHTML = '<svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>';
          closeEl.title = 'Close tab';
          closeEl.onclick = (ev) => closeTab(tab.id, ev);
          tabEl.appendChild(closeEl);

          container.appendChild(tabEl);
        }

        tabEl.dataset.index = index;

        if (isActive) {
          tabEl.classList.add('active');
          tabEl.setAttribute('aria-selected', 'true');
        } else {
          tabEl.classList.remove('active');
          tabEl.setAttribute('aria-selected', 'false');
        }

        const iconEl = tabEl.querySelector('.tab-favicon');
        if (iconEl) {
          if (tab.url.startsWith('evergreen://newtab') || tab.url === 'about:blank' || tab.url.startsWith('evergreen://settings')) {
            iconEl.src = "data:image/png;base64,{{LOGO_BASE64}}";
            iconEl.style.display = 'block';
          } else if (tab.favicon_uri) {
            iconEl.src = tab.favicon_uri;
            iconEl.style.display = 'block';
          } else {
            iconEl.style.display = 'none';
          }
        }

        const titleEl = tabEl.querySelector('.tab-title');
        if (titleEl) {
          let displayTitle = tab.title;
          if (!displayTitle || displayTitle === 'about:blank' || displayTitle === 'evergreen://newtab') {
            displayTitle = 'New Tab';
          } else if (displayTitle === 'evergreen://settings') {
            displayTitle = 'Settings';
          }
          titleEl.textContent = displayTitle;
          titleEl.title = displayTitle;
        }

        if (isActive) {
          const omnibox = document.getElementById('omnibox');
          if (!tab.url.startsWith('data:text/html')) {
            if (isTabSwitch || omnibox.dataset.lastSyncedUrl !== tab.url || document.activeElement !== omnibox) {
              omnibox.value = tab.url;
              omnibox.dataset.lastSyncedUrl = tab.url;
            }
          }

          document.getElementById('btnBack').disabled = !tab.can_go_back;
          document.getElementById('btnForward').disabled = !tab.can_go_forward;

          const lockBtn = document.getElementById('btnLock');
          const lockIcon = document.getElementById('lockIcon');
          if (tab.url.startsWith('https://')) {
            lockBtn.className = 'omnibox-lock-btn secure';
            lockBtn.dataset.state = 'secure';
            lockBtn.title = 'Connection is secure (HTTPS) — Click for certificate details';
            lockIcon.innerHTML = '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>';
          } else if (tab.url.startsWith('http://')) {
            lockBtn.className = 'omnibox-lock-btn insecure';
            lockBtn.dataset.state = 'insecure';
            lockBtn.title = 'Connection is not secure (HTTP) — Click for details';
            lockIcon.innerHTML = '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>';
          } else {
            lockBtn.className = 'omnibox-lock-btn internal';
            lockBtn.dataset.state = 'internal';
            lockBtn.title = 'Evergreen Sandbox Page — Click for details';
            lockIcon.innerHTML = '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>';
          }
        }
      });
    };

    window.__focusOmnibox = function() {
      const omnibox = document.getElementById('omnibox');
      omnibox.focus();
      omnibox.select();
    };

    document.addEventListener('click', (e) => {
      const zoomDialog = document.getElementById('zoomDialog');
      if (zoomDialog && !zoomDialog.contains(e.target) && e.target.id !== 'zoomBadge') {
        zoomDialog.style.display = 'none';
      }
    });

    window.onload = () => {
      postIpc('ChromeReady');
    };
  </script>
</body>
</html>
