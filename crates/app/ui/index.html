<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evergreen Browser</title>
  <style>
    :root {
      --bg-chrome: #1e1e26;
      --bg-tab: #272733;
      --bg-tab-active: #141419;
      --bg-tab-hover: #2f2f3f;
      --bg-omnibox: #262633;
      --bg-omnibox-focus: #181820;
      --text-main: #f3f3f8;
      --text-muted: #9595a6;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: #4e8cff;
      --accent: #4e8cff;
      --danger-color: #ef4444;
      --font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-chrome);
      color: var(--text-main);
      font-family: var(--font-family);
      font-size: 13px;
      overflow: hidden;
      height: 76px;
      display: flex;
      flex-direction: column;
      border-bottom: 1px solid var(--border-subtle);
    }

    svg {
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* Tab Strip */
    .tab-strip {
      display: flex;
      align-items: center;
      height: 38px;
      padding: 5px 8px 0 8px;
      gap: 4px;
      background: var(--bg-chrome);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tab-strip::-webkit-scrollbar {
      display: none;
    }

    #tabsContainer {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 33px;
      min-width: 140px;
      max-width: 240px;
      padding: 0 10px;
      background: var(--bg-tab);
      border-radius: 8px 8px 0 0;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
      transition: background 0.1s ease, color 0.1s ease;
      position: relative;
      border: 1px solid transparent;
      border-bottom: none;
    }

    .tab.active {
      background: var(--bg-tab-active);
      color: var(--text-main);
      font-weight: 500;
      border-color: var(--border-subtle);
      box-shadow: 0 -2px 6px rgba(0, 0, 0, 0.25);
    }

    .tab:hover:not(.active) {
      background: var(--bg-tab-hover);
      color: var(--text-main);
    }

    .tab-favicon {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      flex-shrink: 0;
      object-fit: contain;
    }

    .tab-title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 12px;
    }

    .tab-close {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 4px;
      opacity: 0.6;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.1s ease, background 0.1s ease;
    }

    .tab-close:hover {
      background: rgba(255, 255, 255, 0.15);
      opacity: 1;
      color: var(--danger-color);
    }

    .tab-close svg {
      width: 12px;
      height: 12px;
    }

    .new-tab-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.1s ease, color 0.1s ease;
    }

    .new-tab-btn:hover {
      background: var(--bg-tab);
      color: var(--text-main);
    }

    .new-tab-btn svg {
      width: 16px;
      height: 16px;
    }

    /* Navigation Bar */
    .nav-bar {
      display: flex;
      align-items: center;
      height: 38px;
      padding: 0 8px;
      gap: 6px;
      background: var(--bg-tab-active);
      border-top: 1px solid var(--border-subtle);
      position: relative;
    }

    .nav-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.1s ease, color 0.1s ease;
    }

    .nav-btn:hover:not(:disabled) {
      background: var(--bg-tab-hover);
      color: var(--text-main);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .nav-btn svg {
      width: 16px;
      height: 16px;
    }

    /* Omnibox */
    .omnibox-container {
      flex: 1;
      display: flex;
      align-items: center;
      position: relative;
      min-width: 0;
    }

    .omnibox-icon {
      position: absolute;
      left: 10px;
      display: flex;
      align-items: center;
      color: var(--text-muted);
      pointer-events: none;
    }

    .omnibox-icon svg {
      width: 13px;
      height: 13px;
    }

    .omnibox {
      width: 100%;
      height: 28px;
      background: var(--bg-omnibox);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 0 14px 0 32px;
      color: var(--text-main);
      font-size: 12px;
      font-family: inherit;
      outline: none;
      user-select: text;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .omnibox:focus {
      border-color: var(--border-focus);
      background: var(--bg-omnibox-focus);
    }
  </style>
</head>
<body>
  <!-- Tab Strip -->
  <div class="tab-strip" id="tabStrip" role="tablist" aria-label="Browser tabs">
    <div id="tabsContainer"></div>
    <button class="new-tab-btn" onclick="createNewTab()" title="New Tab" aria-label="New Tab">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <!-- Navigation Bar -->
  <div class="nav-bar">
    <button class="nav-btn" id="btnBack" onclick="sendAction('GoBack')" title="Back" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <button class="nav-btn" id="btnForward" onclick="sendAction('GoForward')" title="Forward" aria-label="Forward">
      <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>
    <button class="nav-btn" id="btnReload" onclick="sendAction('Reload')" title="Reload" aria-label="Reload">
      <svg viewBox="0 0 24 24">
        <path d="M21 2v6h-6"/>
        <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
        <path d="M3 22v-6h6"/>
        <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
      </svg>
    </button>

    <div class="omnibox-container">
      <div class="omnibox-icon">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <input
        type="text"
        class="omnibox"
        id="omnibox"
        placeholder="Search DuckDuckGo or enter address"
        aria-label="Address and search bar"
        onkeydown="handleOmniboxKey(event)"
      />
    </div>

    <!-- 3-Dot Menu Toggle (Triggers native Win32 popup menu via IPC to eliminate airspace clipping) -->
    <button class="nav-btn" id="btnMenu" onclick="triggerNativeMenu(event)" title="Menu" aria-label="Menu">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="1.5"/>
        <circle cx="12" cy="5" r="1.5"/>
        <circle cx="12" cy="19" r="1.5"/>
      </svg>
    </button>
  </div>

  <script>
    let activeTabId = null;

    function postIpc(action, payload = null) {
      if (window.ipc) {
        window.ipc.postMessage(JSON.stringify({ action, payload }));
      } else {
        console.log('[IPC OUT]', action, payload);
      }
    }

    function sendAction(action) {
      postIpc(action);
    }

    function createNewTab() {
      postIpc('CreateTab', { url: null });
    }

    function closeTab(id, event) {
      if (event) event.stopPropagation();
      const tabEl = document.getElementById('tab-' + id);
      if (tabEl) tabEl.remove();
      postIpc('CloseTab', { id });
    }

    function switchTab(id) {
      postIpc('SwitchTab', { id });
    }

    function handleOmniboxKey(e) {
      if (e.key === 'Enter') {
        const val = e.target.value.trim();
        if (val) {
          postIpc('Navigate', { url: val });
        }
      }
    }

    function triggerNativeMenu(e) {
      e.stopPropagation();
      const rect = document.getElementById('btnMenu').getBoundingClientRect();
      // Pass coordinates to host so native Windows menu opens right below button
      postIpc('OpenMenu', { x: rect.right, y: rect.bottom });
    }

    // Window interface called by Rust host via evaluate_script
    window.__shellUpdate = function(msg) {
      if (!msg) return;
      const state = msg.data || msg;
      if (!state.tabs) return;

      const container = document.getElementById('tabsContainer');
      activeTabId = state.active_tab_id;

      // Track incoming tabs to remove closed ones
      const incomingIds = new Set(state.tabs.map(t => t.id));

      // Remove any DOM tabs no longer present
      Array.from(container.children).forEach(child => {
        const rawId = child.id.replace('tab-', '');
        const numId = parseInt(rawId, 10);
        if (!incomingIds.has(numId)) {
          child.remove();
        }
      });

      // Smooth DOM diffing & updating
      state.tabs.forEach((tab, index) => {
        let tabEl = document.getElementById('tab-' + tab.id);
        const isActive = (tab.id === state.active_tab_id);

        if (!tabEl) {
          tabEl = document.createElement('div');
          tabEl.id = 'tab-' + tab.id;
          tabEl.className = 'tab';
          tabEl.setAttribute('role', 'tab');
          tabEl.onclick = () => switchTab(tab.id);

          // 1. Favicon element
          const iconEl = document.createElement('img');
          iconEl.className = 'tab-favicon';
          iconEl.alt = '';
          iconEl.onerror = function() { this.style.display = 'none'; };
          tabEl.appendChild(iconEl);

          // 2. Title element
          const titleEl = document.createElement('span');
          titleEl.className = 'tab-title';
          tabEl.appendChild(titleEl);

          // 3. Close button
          const closeEl = document.createElement('span');
          closeEl.className = 'tab-close';
          closeEl.innerHTML = '<svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>';
          closeEl.title = 'Close tab';
          closeEl.onclick = (ev) => closeTab(tab.id, ev);
          tabEl.appendChild(closeEl);

          // Append in order
          container.appendChild(tabEl);
        }

        // Update active class
        if (isActive) {
          tabEl.classList.add('active');
          tabEl.setAttribute('aria-selected', 'true');
        } else {
          tabEl.classList.remove('active');
          tabEl.setAttribute('aria-selected', 'false');
        }

        // Update Favicon source
        const iconEl = tabEl.querySelector('.tab-favicon');
        if (iconEl) {
          if (tab.url.startsWith('evergreen://newtab')) {
            iconEl.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2334d399' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 2L4 12h5l-4 8h14l-4-8h5L12 2z'/%3E%3Cpath d='M12 20v2'/%3E%3C/svg%3E";
            iconEl.style.display = 'block';
          } else if (tab.url.startsWith('evergreen://settings')) {
            iconEl.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239595a8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='3'/%3E%3Cpath d='M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z'/%3E%3C/svg%3E";
            iconEl.style.display = 'block';
          } else if (tab.favicon_uri) {
            iconEl.src = tab.favicon_uri;
            iconEl.style.display = 'block';
          } else {
            iconEl.style.display = 'none';
          }
        }

        // Update Title text
        const titleEl = tabEl.querySelector('.tab-title');
        if (titleEl) {
          let displayTitle = tab.title;
          if (!displayTitle || displayTitle === 'about:blank' || displayTitle === 'evergreen://newtab') {
            displayTitle = 'New Tab';
          } else if (displayTitle === 'evergreen://settings') {
            displayTitle = 'Settings';
          }
          titleEl.textContent = displayTitle;
          titleEl.title = displayTitle;
        }

        // Update omnibox & navigation buttons for active tab
        if (isActive) {
          const omnibox = document.getElementById('omnibox');
          if (document.activeElement !== omnibox) {
            // Requirement 3: Full URL path always visible
            omnibox.value = tab.url;
          }

          document.getElementById('btnBack').disabled = !tab.can_go_back;
          document.getElementById('btnForward').disabled = !tab.can_go_forward;
        }
      });
    };

    window.__focusOmnibox = function() {
      const omnibox = document.getElementById('omnibox');
      omnibox.focus();
      omnibox.select();
    };

    // Signal ready when DOM is parsed
    window.onload = () => {
      postIpc('ChromeReady');
    };
  </script>
</body>
</html>
