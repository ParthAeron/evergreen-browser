[package]
name = "evergreen-installer"
version = "0.1.0"
edition = "2021"
authors = ["Parth"]
description = "Fast, non-elevated desktop installer for Evergreen Browser"
license = "MIT OR Apache-2.0"

[dependencies]
evergreen-core = { path = "../core" }
winit = "0.30"
wry = "0.57"
serde_json = "1.0"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = [
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
] }

[build-dependencies]
winres = "0.1"

