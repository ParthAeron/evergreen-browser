[package]
name = "evergreen-core"
version = "0.1.0"
edition = "2021"
authors = ["Parth"]
description = "Engine-agnostic core logic and interfaces for Evergreen Browser"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
]

